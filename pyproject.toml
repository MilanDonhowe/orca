[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orca-ocr"
version = "0.1.0"
description = "OCR and regex classification-driven automation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "paho-mqtt>=2.1,<3",
  "rapidocr-onnxruntime>=1.4,<2",
  "tomli>=2,<3; python_version < '3.11'",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
orca = "orca.cli:main"
orca-monitor = "orca.monitor:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
